<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 护花使者</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#EAF3E4">
<meta name="color-scheme" content="light">
<style>
  :root{--bg:#F6F3E9;--ink:#14351F;--muted:#5C7161;--green:#1F7A3D;--lime:#C9E86A;--line:rgba(20,53,31,.13)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif}
  .card{max-width:560px;width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 32px;
    box-shadow:0 18px 50px -28px rgba(20,53,31,.35)}
  .code{font-size:13px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  h1{margin:12px 0 10px;font-size:clamp(24px,4vw,34px);line-height:1.25}
  p{margin:0 0 22px;color:var(--muted);line-height:1.7}
  .actions{display:flex;flex-wrap:wrap;gap:10px}
  a.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;text-decoration:none;
    font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--ink);background:transparent}
  a.btn--primary{background:var(--green);border-color:var(--green);color:#fff}
  a.btn--lime{background:var(--lime);border-color:var(--lime);color:var(--ink)}
  .foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  code{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;word-break:break-all}
</style>
</head>
<body>
<main class="card">
  <div class="code">Error 404</div>
  <h1>这个页面不在这儿。</h1>
  <p>你访问的地址可能已经随着版本更新挪了位置。护花使者目前处于验证平台阶段，旧版安装包的下载链接会随发版下线，因此收藏夹里的旧链接可能已经失效。</p>
  <div class="actions">
    <a class="btn btn--primary" href="./">回到首页</a>
    <a class="btn btn--lime" href="./#download">下载最新 Android App</a>
    <a class="btn" href="quadcopter.html">三维拆解演示</a>
  </div>
  <div class="foot">
    如果这是从我们页面里点出来的死链，请把来源地址发到 <code>hello@huhuashizhe.example</code>，我们修。
  </div>
</main>
</body>
</html>
